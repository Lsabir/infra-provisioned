name: Terraform — Standard Pipeline

on:
  pull_request:
    branches: [main]
    paths: ['**/*.tf', '**/*.tfvars']
  push:
    branches: [main]
    paths: ['**/*.tf', '**/*.tfvars']

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Détecter le dossier Terraform modifié
        id: tf_dir
        run: |
          echo "🔎 Diff entre origin/${{ github.base_ref }} et HEAD"
          git diff --name-only origin/${{ github.base_ref }}...HEAD | tee /tmp/changed_files.txt
          CHANGED_DIR=$(cat /tmp/changed_files.txt | grep '\.tf$' | xargs -I{} dirname {} | sort -u | head -1)
          if [ -z "$CHANGED_DIR" ]; then
            echo "❌ Aucun fichier .tf modifié détecté"
            exit 1
          fi
          echo "dir=$CHANGED_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Dossier Terraform : $CHANGED_DIR"

       steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan
