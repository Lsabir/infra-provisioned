name: 'Terraform Azure Deployment'

on:
  pull_request:              # ← AJOUTER JUSTE CET BLOC
    branches:
      - main
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init              # ← SANS le "cd terraform &&"

      - name: Terraform Plan
        run: terraform plan -out=tfplan  # ← SANS le "cd terraform &&"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan  # ← SANS le "cd terraform &&"
