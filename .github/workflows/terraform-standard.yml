name: Terraform Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurer ARM credentials
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Supprimer les blocs backend
        working-directory: terraform
        run: |
          python3 << 'PYEOF'
          import re, glob
          def remove_backends(c):
              lines, result, in_b, depth = c.split('\n'), [], False, 0
              for line in lines:
                  if not in_b:
                      if re.match(r'\s*backend\s+"[^"]+"\s*\{', line):
                          in_b, depth = True, line.count('{') - line.count('}')
                          continue
                      result.append(line)
                  else:
                      depth += line.count('{') - line.count('}')
                      if depth <= 0:
                          in_b, depth = False, 0
              return '\n'.join(result)
          for f in glob.glob('*.tf'):
              c = open(f).read()
              n = remove_backends(c)
              if n != c:
                  open(f, 'w').write(n)
                  print(f'backend supprimé : {f}')
          PYEOF

      - name: Restaurer le state Terraform
        uses: actions/cache/restore@v4
        with:
          path: terraform/terraform.tfstate
          key: tfstate-${{ github.sha }}
          restore-keys: |
            tfstate-

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Plan
        working-directory: terraform
        run: |
          TFVARS=""
          if [ -f terraform.tfvars ]; then TFVARS="-var-file=terraform.tfvars"; fi
          terraform plan -no-color $TFVARS

      - name: Terraform Apply
        working-directory: terraform
        run: |
          TFVARS=""
          if [ -f terraform.tfvars ]; then TFVARS="-var-file=terraform.tfvars"; fi
          terraform apply -auto-approve -no-color $TFVARS

      - name: Sauvegarder le state Terraform
        if: always()
        uses: actions/cache/save@v4
        with:
          path: terraform/terraform.tfstate
          key: tfstate-${{ github.sha }}
