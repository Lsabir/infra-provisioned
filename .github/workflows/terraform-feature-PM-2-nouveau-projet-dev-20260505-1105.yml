name: Terraform Infra — Plan & Apply

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'nouveau-projet/**'
  push:
    branches: [ main ]
    paths:
      - 'nouveau-projet/**'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1 : PLAN — s'exécute sur chaque PR et chaque push sur main
  # ──────────────────────────────────────────────────────────────────
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nouveau-projet

    permissions:
      contents: read
      id-token: write
      pull-requests: write    # pour poster les résultats du plan en commentaire PR

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure -backend=false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true
        env:
          TF_VAR_environment: "dev"

      - name: Post Plan Result to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## Terraform Plan — nouveau-projet

            | Étape       | Résultat                              |
            |-------------|---------------------------------------|
            | Format      | ${{ steps.fmt.outcome }}              |
            | Init        | ${{ steps.init.outcome }}             |
            | Validate    | ${{ steps.validate.outcome }}         |
            | **Plan**    | **${{ steps.plan.outcome }}**         |

            > Plan généré automatiquement par l\'Agent IA DevOps.
            > **Reviewez ce plan avant de merger la PR.**
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success' || steps.plan.outcome == 'changes'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-nouveau-projet
          path: nouveau-projet/tfplan
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 : APPLY — s'exécute UNIQUEMENT sur push vers main
  #          (après merge de la PR = approbation humaine confirmée)
  # ──────────────────────────────────────────────────────────────────
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: nouveau-projet

    # Environnement GitHub avec protection de branche et required reviewers
    # Configurer dans : Settings > Environments > production > Required reviewers
    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        run: terraform init -reconfigure -backend=false

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -auto-approve
        env:
          TF_VAR_environment: "dev"
